[project]
name = "backtest-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
# Starlette の TestClient が「httpx の代わりに httpx2 を使って」と警告を出す。動作には影響しないので表示しない
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 日本語は1文字を幅2として数えるため、コメントやメッセージがすぐ上限を超える。
# コードの折り返しは ruff format に任せ、行の長さのチェックはしない
ignore = ["E501"]
