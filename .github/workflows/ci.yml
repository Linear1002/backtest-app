name: CI

on:
  push:
  pull_request:

# 同じブランチで新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python(lint・テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # このアクションはメジャータグ(v10)を出していないため完全なバージョンで固定
        with:
          enable-cache: true
      # .python-version の Python を uv が入れ、uv.lock どおりに依存を入れる
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  cpp:
    name: C++(ビルド・テスト)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # C++ 版エンジン(開発者が書く)ができたら、正解データ(tests/golden)と答え合わせする。
      # 段階1に取り組んでいる間は engine/cpp/STAGE に 1 と書いておく(docs/cpp/README.md)
      - name: 答え合わせの準備(uv)
        if: hashFiles('engine/cpp/CMakeLists.txt') != ''
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: C++ 版と正解データの答え合わせ
        if: hashFiles('engine/cpp/CMakeLists.txt') != ''
        run: |
          uv sync --locked
          STAGE=$(cat engine/cpp/STAGE 2>/dev/null || echo 2)
          echo "段階${STAGE}までのケースで答え合わせします"
          BACKTEST_CPP_STAGE="$STAGE" uv run pytest tests/python/test_golden.py -k cpp -v

  frontend:
    name: frontend(lint・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
